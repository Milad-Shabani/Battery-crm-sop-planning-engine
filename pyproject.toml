[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-sop-planning"
version = "1.0.0"
description = "CRM + S&OP planning engine for a battery manufacturer: Dynamics-365-style CRM pipeline, demand forecasting blended with open opportunities, capacity-constrained production planning (LP), and MRP."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "flake8>=7.0", "black>=24.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100
